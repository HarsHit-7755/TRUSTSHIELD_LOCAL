<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRUSTSHIELD | Account</title><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"></head><body class="auth-body"><main class="auth-wrap"><a class="brand auth-brand" href="/"><span class="mark">T</span><span>TRUSTSHIELD<small>ACCOUNT SETTINGS</small></span></a><section class="auth-card"><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password.</h1><p class="auth-sub">Signed in as <b>{{ session.username }}</b>.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="/account/password"><label>CURRENT PASSWORD</label><input type="password" name="old_password" required><label>NEW PASSWORD</label><input type="password" name="new_password" minlength="10" required><label>CONFIRM NEW PASSWORD</label><input type="password" name="confirm" minlength="10" required><button class="auth-submit">Update password →</button></form><div class="auth-switch"><a href="/">← Back to dashboard</a></div></section></main></body></html>
